name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  # Each test server holds a descriptor set per worker (256 by default).
  RUST_TEST_THREADS: "4"
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Test (blocking driver)
        run: cargo test --all-features
        env:
          RUSTFLAGS: "--cfg serve_net_blocking_tests"
      - name: Build examples
        run: cargo build --examples
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  idle:
    name: 10,000 idle connections (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test is client and server in one process: 20,000 descriptors.
      - name: Raise the descriptor limit
        if: runner.os == 'macOS'
        run: sudo sysctl -w kern.maxfiles=65536 kern.maxfilesperproc=65536
      - name: Hold them
        shell: bash
        run: |
          ulimit -n 30000 || ulimit -n "$(ulimit -Hn)" || true
          cargo test --all-features --test idle -- --ignored --nocapture

  security:
    name: Security (audit + deny)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check

  fuzz:
    name: Fuzz smoke (nightly)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target for 30 s (corpus outside the repository)
        working-directory: fuzz
        run: |
          for t in forwarded_xff forwarded_rfc7239 conn_sim config; do
            mkdir -p "$RUNNER_TEMP/corpus/$t"
            # The prebuilt cargo-fuzz is a musl build and would default to its
            # own target, which the address sanitizer does not support.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" "$RUNNER_TEMP/corpus/$t" -- -max_total_time=30 -rss_limit_mb=2048
          done

  interop:
    name: Interop (nginx, Apache, HAProxy)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real front ends against the interop example
        run: bash .github/interop/run.sh

  loom:
    name: Loom models
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg serve_net_loom -D warnings"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the loom models
        run: cargo test --lib --release loom_tests

  systemd:
    name: systemd (notify-reload, watchdog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ten reloads under load as a real unit
        run: bash .github/systemd/run.sh
