defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend v2
    bind 127.0.0.1:8083
    default_backend app_v2

frontend v1
    bind 127.0.0.1:8084
    default_backend app_v1

backend app_v2
    server app 127.0.0.1:9002 send-proxy-v2

backend app_v1
    server app 127.0.0.1:9002 send-proxy
