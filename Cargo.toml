# =============================================================================
#  R E P S   ·   serve-net
# =============================================================================
[package]
name    = "serve-net"
version = "0.7.1"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# The fuzz and compare crates are their own workspaces and are not part of the package.
exclude = ["fuzz/", "compare/"]

# Description
description = "The network service engine for Rust: listeners over net-io, ingress from direct clients, reverse proxies (PROXY protocol or trusted forwarded headers), Unix sockets, and FastCGI, a per-connection engine with a slot for any sans-IO protocol engine, admission, drain, and restarts without dropped connections."

# Keywords (5 max)
keywords = ["server", "network", "service", "http", "engine"]

# Categories
categories = ["network-programming", "web-programming"]

# Links
homepage      = "https://github.com/jamesgober/serve-net"
repository    = "https://github.com/jamesgober/serve-net"
documentation = "https://docs.rs/serve-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "serve_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["http1"]
# The HTTP family over http-net: HttpService, HttpRequest, HttpReply,
# engine::Http1, the Tier 1 functions, and the testing helpers.
http1 = ["dep:http-net"]
# WebSocket upgrades over ws-net: UpgradeTarget::WebSocket, WebSocketService,
# WebSocketTarget, WebSocketConn.
ws = ["http1", "dep:ws-net"]


# DEPENDENCIES
# #################################
[dependencies]
# First-party crates at published versions only (dev/PLAN.md section 3.2).
# net-io: the transport (required).
net-io = "0.7.1"
http-net = { version = "0.9", default-features = false, optional = true }
ws-net = { version = "0.9", default-features = false, optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# The client side of the WebSocket tests (masking needs `std`).
ws-net = "0.9"
# A real TLS engine for the end-to-end TLS and ALPN tests; serve-net itself
# takes any net-io acceptor. ring, so no build needs NASM or CMake.
tls-net = { version = "0.9", default-features = false, features = ["ring", "net-io"] }

# The loom models run with RUSTFLAGS="--cfg serve_net_loom" (a name of our
# own: `--cfg loom` reaches every crate in the build, net-io included).
[target.'cfg(serve_net_loom)'.dev-dependencies]
loom = "0.7"


# LINTS
# #################################
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(serve_net_loom)", "cfg(serve_net_blocking_tests)"] }


# BENCHMARKS
# #################################
[[example]]
name = "hello"
required-features = ["http1"]

[[example]]
name = "behind_proxy"
required-features = ["http1"]

[[example]]
name = "interop"
required-features = ["http1"]

[[example]]
name = "websocket"
required-features = ["ws"]

[[example]]
name = "systemd"
required-features = ["http1"]

[[bench]]
name = "core"
harness = false
required-features = ["http1"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
