# =============================================================================
#  R E P S   ·   serve-net
# =============================================================================
[package]
name    = "serve-net"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "The network service engine for Rust: listeners through net-io, a per-connection engine with a slot for any protocol engine, the connection gate wired in, every ingress mode (direct, reverse proxy, Unix socket, FastCGI, CGI), drain, and a core for lifecycle."

# Keywords (5 max)
keywords = ["server", "network", "service", "http", "engine"]

# Categories
categories = ["network-programming", "web-programming"]

# Links
homepage      = "https://github.com/jamesgober/serve-net"
repository    = "https://github.com/jamesgober/serve-net"
documentation = "https://docs.rs/serve-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "serve_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
